<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>XINGJI 工作室文档站</title>
  <meta name="XINGJI 工作室线上文档站" content="XINGJI 工作室线上文档站">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 引入主题样式 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5.0.0/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css">
  <style>
    :root {
      --theme-color: #00a2e8;
      --themeColor: #00a2e8;
    }
    .sidebar {
      padding-left: 14px;
    }
    .sidebar-nav {
      padding-left: 8px;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  
  <script>
    window.$docsify = {
      name: 'XINGJI 工作室文档站',     // 网站名称
      repo: 'https://github.com/xingji-studio/xingji-docs.github.io', // 仓库链接
      loadSidebar:  true,             // 启用侧边栏
      loadNavbar:   true,             // 启用顶部导航
      coverpage:    false,            // 启用封面
      auto2top:     true,             // 切换页面时自动滚动到顶部
      maxLevel:     4,                // 最大标题层级
      subMaxLevel:  0,                // 侧边栏子目录最大显示级别（0=禁用自动生成目录）
      sidebarDisplayLevel: 0,         // 默认展开到第几级（0=全部折叠，1=展开一级）
      search:       'auto',           // 启用全文搜索
    }
  </script>
  
  <!-- 引入 Docsify 核心库 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
